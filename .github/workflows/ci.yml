name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Placeholders only. The tests mock every external service.
      SECRET_KEY: test
      ENV: test
      CLERK_SECRET_KEY: test
      CLERK_WEBHOOK_SIGNING_SECRET: test
      CLERK_FRONTEND_API: test
      CLERK_DEV_FRONTEND_API: test
      R2_ENDPOINT_URL: https://example.invalid
      R2_ACCESS_KEY: test
      R2_SECRET_ACCESS_KEY: test
      R2_BUCKET_NAME: test
      NEON_DB_CONNECT: sqlite://
      REDIS_URL: redis://localhost:6379
      GROQ_API_KEY: test
      GEMINI_API_KEY: test
      DEEPSEEK_API_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install ffmpeg (the ingest and render tests run it for real)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The coverage gate is configured in backend/.coveragerc.
      - run: pytest --cov=app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/clippper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/clippper/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
